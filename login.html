<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwasthPath - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dff6f0, #b8e8df);
        }
        
        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #159a8c;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-box {
            margin-bottom: 20px;
        }
        
        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }
        
        .input-box input:focus {
            border-color: #159a8c;
            box-shadow: 0 0 5px rgba(21, 154, 140, 0.3);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #159a8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .login-btn:hover {
            background: #117c71;
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #eefaf7;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">SwasthPath</div>

        <div class="subtitle">
            Rural Health Guidance Assistant
        </div>

        <form onsubmit="loginUser(event)">

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="demo">
            Demo Login: enter any valid email and password.
        </div>

    </div>

    <script>
        function loginUser(event) {
            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (email !== "" && password !== "") {

                message.style.color = "green";
                message.innerHTML = "Login Successful!";

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 800);

            } else {

                message.style.color = "red";
                message.innerHTML = "Please enter Email and Password.";

            }
        }
    </script>

</body>

</html>
